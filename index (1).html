<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Marketing — chiến dịch, nội dung, leads và sổ thu chi</title>
<meta name="description" content="Theo dõi chiến dịch marketing, lịch nội dung, leads, sổ thu chi, VAT và báo cáo lãi lỗ trong một trang.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%232346A0'/%3E%3Cpath d='M16 20h32M16 32h32M16 44h20' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='44' r='7' fill='none' stroke='%23F28A99' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --paper: #F4F6F3;
    --sheet: #FFFFFF;
    --ink: #1F2A44;
    --ink-soft: #5A6377;
    --blue: #2346A0;
    --blue-hover: #1A3681;
    --blue-wash: #E7ECF8;
    --red: #C8102E;
    --red-wash: #FBE8EB;
    --amber: #9A5B00;
    --amber-wash: #FBF0DC;
    --rule: #D8DDE6;
    --rule-strong: #A9B1C0;
    --margin: #E9A3AB;
    --focus: #2346A0;
    --font: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.55 var(--font);
    padding-bottom: env(safe-area-inset-bottom, 0px);
}
a { color: var(--blue); text-underline-offset: 2px; }
a:hover { color: var(--blue-hover); }
h1, h2, h3 { line-height: 1.25; margin: 0; font-weight: 600; }
h1 { font-size: 1.75rem; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; margin: 36px 0 12px; }
p { margin: 0 0 12px; }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--ink-soft); }
.small { font-size: 0.86rem; }
.pos { color: var(--blue); }
.neg { color: var(--red); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }

/* ---------- Header and navigation ---------- */
.top {
    background: var(--sheet);
    border-bottom: 1px solid var(--rule);
    padding-top: env(safe-area-inset-top, 0px);
    position: sticky; top: 0; z-index: 10;
}
.top-inner { max-width: 1240px; margin: 0 auto; padding: 0 20px; display: flex; align-items: stretch; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; white-space: nowrap; color: var(--ink); text-decoration: none; padding: 14px 0; }
.brand svg { flex: none; }
.nav { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.nav::-webkit-scrollbar { display: none; }
.nav-group { display: flex; align-items: stretch; gap: 2px; }
.nav-group + .nav-group { padding-left: 16px; border-left: 1px solid var(--rule); margin: 10px 0; }
.nav-group + .nav-group a { margin-top: -10px; margin-bottom: -10px; }
.nav-label { align-self: center; font-size: 0.78rem; color: var(--ink-soft); margin-right: 8px; white-space: nowrap; }
.nav a {
    display: flex; align-items: center; padding: 0 9px; white-space: nowrap;
    color: var(--ink-soft); text-decoration: none; border-bottom: 3px solid transparent; border-top: 3px solid transparent;
}
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--blue); }

/* ---------- Page ---------- */
main:focus { outline: none; }
main { max-width: 1240px; margin: 0 auto; padding: 28px 20px 64px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-head p { margin: 6px 0 0; color: var(--ink-soft); max-width: 70ch; }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.notice { background: var(--amber-wash); color: var(--amber); padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; }
.notice.is-red { background: var(--red-wash); color: var(--red); }

/* ---------- Controls ---------- */
.btn {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    font: 500 0.92rem/1 var(--font); padding: 10px 14px; min-height: 40px;
    border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet); color: var(--ink);
    cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-soft); color: var(--ink); }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); color: #fff; }
.btn-link { border: 0; background: none; padding: 4px 2px; min-height: 0; color: var(--blue); font-weight: 500; }
.btn-link:hover { text-decoration: underline; color: var(--blue-hover); }
.btn-link.is-danger { color: var(--red); }
.btn svg { flex: none; }

label, .label { display: block; font-size: 0.84rem; color: var(--ink-soft); margin-bottom: 4px; }
input[type=text], input[type=date], input[type=month], input[type=email], input[type=tel], input[type=url], input[type=search], select, textarea {
    font: 400 0.95rem/1.3 var(--font); color: var(--ink);
    width: 100%; padding: 9px 10px; min-height: 40px;
    border: 1px solid var(--rule-strong); border-radius: 6px; background: var(--sheet);
}
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 0.95rem; margin: 0; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--blue); }

.toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 14px; margin-bottom: 18px; }
.toolbar > div { flex: 0 1 190px; min-width: 130px; }
.toolbar > .grow { flex: 1 1 240px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 18px; }
.chip { font: 500 0.85rem/1 var(--font); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-soft); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--blue-wash); border-color: var(--blue); color: var(--blue); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 16px; }
.grid .wide { grid-column: 1 / -1; }
.radio-row { display: flex; gap: 18px; padding-top: 8px; }

/* ---------- Ledger-style tables ---------- */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.book { width: 100%; border-collapse: collapse; background: var(--sheet); font-size: 0.93rem; }
table.book th {
    text-align: left; font-weight: 600; font-size: 0.82rem; color: var(--ink-soft);
    padding: 10px 12px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; background: var(--sheet);
}
table.book th.num { text-align: right; }
table.book td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.book tbody tr:hover td { background: #FAFBFD; }
/* the red margin rule of a paper ledger */
table.book.ruled { box-shadow: inset 3px 0 0 var(--sheet), inset 4px 0 0 var(--margin), inset 6px 0 0 var(--sheet), inset 7px 0 0 var(--margin); }
table.book.ruled td:first-child, table.book.ruled th:first-child { padding-left: 20px; }
/* accounting totals: single rule above, double rule below */
table.book tfoot td { font-weight: 600; border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); padding-top: 10px; }
table.book .sub { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-top: 2px; }
table.book .sub.neg { color: var(--red); }
table.book.wide-first td:first-child { min-width: 220px; }
table.book .actions { white-space: nowrap; text-align: right; }
table.book tr.group-start td { border-top: 1px solid var(--rule-strong); }
table.book td.indent { padding-left: 36px; }

/* ---------- Tally: label .......... value ---------- */
.tally { margin: 0; padding: 0; max-width: 560px; }
.tally div { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; padding: 7px 0; }
.tally dt { color: var(--ink-soft); }
.tally dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.tally div::after { content: none; }
.tally .lead { flex: 1; border-bottom: 1px dotted var(--rule-strong); transform: translateY(-4px); min-width: 20px; }
.tally .note { flex-basis: 100%; text-align: right; font-size: 0.82rem; color: var(--ink-soft); margin-top: 2px; }
.tally div.total { border-top: 1px solid var(--ink); margin-top: 4px; padding-top: 9px; }
.tally div.total dd { border-bottom: 3px double var(--ink); padding-bottom: 2px; }
.tallies { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 48px; }

/* ---------- Dashboard statement ---------- */
.statement { font-size: clamp(1.25rem, 2.6vw, 1.75rem); line-height: 1.45; font-weight: 500; max-width: 34em; margin: 4px 0 28px; letter-spacing: -0.01em; }
.statement b { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.statement .roas { color: var(--blue); }
.statement .roas.is-low { color: var(--red); }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 0 48px; }

/* ---------- Tags and bars ---------- */
.tag { display: inline-block; font-size: 0.8rem; line-height: 1.3; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--rule); color: var(--ink-soft); background: var(--sheet); white-space: nowrap; }
.tag.is-running, .tag.is-published, .tag.is-won { border-color: var(--blue); color: var(--blue); background: var(--blue-wash); }
.tag.is-paused, .tag.is-review, .tag.is-proposal { border-color: #E3C48F; color: var(--amber); background: var(--amber-wash); }
.tag.is-lost { border-color: #EBB0B8; color: var(--red); background: var(--red-wash); }
.tag.is-scheduled, .tag.is-qualified { border-color: var(--rule-strong); color: var(--ink); }
.bar { height: 4px; background: var(--rule); margin-top: 6px; min-width: 80px; }
.bar span { display: block; height: 100%; background: var(--blue); }
.bar.is-over span { background: var(--red); }

/* ---------- Charts ---------- */
.chart { width: 100%; height: auto; display: block; margin: 4px 0 8px; }
.chart text { font-family: var(--font); fill: var(--ink-soft); font-size: 12px; }
.chart.is-compact text { font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }

/* ---------- Content agenda ---------- */
.month-nav { display: flex; align-items: center; gap: 10px; }
.month-nav h2 { margin: 0 6px; min-width: 9em; }
.agenda { border-top: 1px solid var(--rule-strong); background: var(--sheet); }
.day { display: grid; grid-template-columns: 120px 1fr; gap: 14px; padding: 12px 14px; border-bottom: 1px solid var(--rule); }
.day.is-today { box-shadow: inset 4px 0 0 var(--blue); }
.day .when { color: var(--ink-soft); font-size: 0.88rem; }
.day .when b { display: block; color: var(--ink); font-size: 1rem; }
.entry { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 4px 0; }
.entry + .entry { border-top: 1px dashed var(--rule); }
.entry .title { font-weight: 600; }
.entry select { width: auto; min-height: 32px; padding: 4px 8px; font-size: 0.86rem; }

/* ---------- Lead board ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 10px; }
.col { background: #EBEEF2; border-radius: 8px; padding: 10px; min-height: 140px; }
.col h3 { font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 10px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.card p { margin: 2px 0; font-size: 0.9rem; }
.card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
.card select { width: auto; max-width: 140px; min-height: 32px; padding: 4px 8px; font-size: 0.85rem; }

/* ---------- Calculators ---------- */
.calcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.calc { background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; padding: 18px 18px 8px; }
.calc h2 { margin: 0 0 4px; }
.calc > p { color: var(--ink-soft); font-size: 0.9rem; }
.calc .grid { grid-template-columns: 1fr 1fr; }
.calc .tally { margin-top: 14px; }

/* ---------- Stamp: the one loud element ---------- */
.stamp {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    border: 3px solid currentColor; border-radius: 6px; padding: 6px 16px 5px;
    color: var(--red); transform: rotate(-6deg); font-weight: 700; letter-spacing: 0.08em;
    box-shadow: inset 0 0 0 2px var(--sheet), inset 0 0 0 3px currentColor;
    background: color-mix(in srgb, var(--red) 4%, transparent);
    mix-blend-mode: multiply; opacity: 0.92; user-select: none;
}
.stamp b { font-size: 1.25rem; line-height: 1.1; }
.stamp small { font-size: 0.78rem; letter-spacing: 0.02em; font-weight: 600; }
.stamp.is-off { color: var(--ink-soft); }
.stamp-wrap { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; margin-bottom: 8px; }
@media (prefers-reduced-motion: no-preference) {
    .stamp.land { animation: stamp-land 420ms cubic-bezier(.2, .9, .3, 1.4) both; }
    @keyframes stamp-land {
        0% { transform: rotate(-14deg) scale(1.9); opacity: 0; }
        60% { opacity: 0.95; }
        100% { transform: rotate(-6deg) scale(1); opacity: 0.92; }
    }
}

/* ---------- Dialog ---------- */
dialog {
    border: 0; border-radius: 10px; padding: 0; width: min(760px, calc(100vw - 24px));
    max-height: calc(100dvh - 32px); color: var(--ink); background: var(--sheet);
    box-shadow: 0 20px 60px rgba(31, 42, 68, 0.25);
}
dialog::backdrop { background: rgba(31, 42, 68, 0.45); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--sheet); z-index: 1; }
.dlg-head h2 { margin: 0; }
.dlg-body { padding: 18px 20px; }
.dlg-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 20px 18px; border-top: 1px solid var(--rule); }
.dlg-foot .spacer { flex: 1; }
.errors { background: var(--red-wash); color: var(--red); padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
.errors:empty { display: none; }
.preview { margin: 14px 0 0; padding: 10px 12px; background: var(--blue-wash); border-radius: 6px; font-variant-numeric: tabular-nums; }
.preview:empty { display: none; }
.hint { color: var(--ink-soft); font-size: 0.86rem; margin: 10px 0 0; max-width: 72ch; }

.toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 6px; font-size: 0.92rem; z-index: 100;
    max-width: calc(100vw - 32px);
}
.toast[hidden] { display: none; }

.empty { background: var(--sheet); border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 28px; max-width: 640px; }
.empty h2 { margin: 0 0 8px; }
.empty .page-actions { margin-top: 16px; }

footer.foot { max-width: 1240px; margin: 0 auto; padding: 0 20px 32px; color: var(--ink-soft); font-size: 0.84rem; }

@media (max-width: 1360px) {
    .nav-label { display: none; }
}
@media (max-width: 720px) {
    .top-inner { flex-direction: column; gap: 0; padding: 0 14px; }
    .brand { padding: 10px 0 4px; }
    .nav { gap: 14px; -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
    .nav-group + .nav-group { padding-left: 14px; margin: 0; border-left: 1px solid var(--rule); }
    .nav-group + .nav-group a { margin: 0; }
    .nav a { padding: 10px 8px 9px; }
    .nav-label { display: none; }
    main { padding: 20px 14px 56px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; }
    .toolbar > div, .toolbar > .grow { min-width: 0; }
    .toolbar > .grow, .toolbar > .month-nav { grid-column: 1 / -1; }
    .page-head .page-actions { width: 100%; }
    h1 { font-size: 1.45rem; }
    .day { grid-template-columns: 1fr; gap: 4px; }
    .calc .grid { grid-template-columns: 1fr; }
    .dlg-body .grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 420px) {
    .dlg-body .grid { grid-template-columns: 1fr; }
}
@media print {
    .top, .page-actions, .toolbar, .chips, .actions, .btn, footer.foot { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
}
</style>
</head>
<body>
<header class="top">
    <div class="top-inner">
        <a class="brand" href="#dashboard">
            <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="10" fill="#2346A0"/><path d="M16 20h32M16 32h32M16 44h20" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="46" cy="44" r="7" fill="none" stroke="#F28A99" stroke-width="4"/></svg>
            Sổ Marketing
        </a>
        <nav class="nav" id="nav" aria-label="Các trang"></nav>
    </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="foot" id="foot"></footer>

<dialog id="dlg" aria-labelledby="dlg-title">
    <form id="dlg-form" novalidate>
        <div class="dlg-head">
            <h2 id="dlg-title"></h2>
            <button type="button" class="btn-link btn" data-act="close-dialog" aria-label="Đóng">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div class="dlg-body">
            <div class="errors" id="dlg-errors" role="alert"></div>
            <div id="dlg-fields"></div>
        </div>
        <div class="dlg-foot" id="dlg-foot"></div>
    </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="restore-file" accept="application/json,.json" hidden>

<script>

    content_status: { idea: 'Ý tưởng', drafting: 'Đang viết', review: 'Chờ duyệt', scheduled: 'Đã lên lịch', published: 'Đã đăng' },

const ACCOUNT_LABELS = {

    income_default: 'TK doanh thu mặc định', expense_default: 'TK chi phí mặc định',
};
const DEFAULT_CATEGORIES = [
    ['Doanh thu bán hàng', 'income', '5111', false],
    ['Doanh thu dịch vụ', 'income', '5113', false],
    ['Doanh thu hoạt động tài chính', 'income', '515', false],
    ['Thu nhập khác', 'income', '711', false],
    ['Quảng cáo online (Facebook, Google, TikTok...)', 'expense', '6417', true],
    ['KOL/KOC, PR, báo chí', 'expense', '6417', true],
    ['Sự kiện, in ấn, POSM', 'expense', '6418', true],
    ['Phần mềm, công cụ marketing', 'expense', '6417', true],

/* ---------------------------------------------------------------- helpers */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const thisYear = () => new Date().getFullYear();
const monthEnd = (y, m) => y + '-' + pad(m) + '-' + pad(new Date(y, m, 0).getDate());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return ymd(new Date(y, m - 1, d + n)); };
const label = (group, key) => (OPT[group] && OPT[group][key]) || (key ? key : '—');

function h(value) {
    return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/** Same rules as the server version: 1500000, 1.500.000, 1,500,000, 1.500.000,5 and 12,5 all work. */
function parseNum(raw) {
    if (typeof raw === 'number') { return isFinite(raw) ? raw : 0; }
    let s = String(raw == null ? '' : raw).replace(/[^\d,.\-]/g, '');
    if (s === '' || s === '-') { return 0; }
    const hasComma = s.includes(','), hasDot = s.includes('.');
    if (hasComma && hasDot) {
        s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    } else if (hasComma) {
        s = /,\d{3}(,|$)/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if (hasDot && /^-?\d{1,3}(\.\d{3})+$/.test(s)) {
        s = s.replace(/\./g, '');
    }
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
}

function parseDate(raw) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(raw || '').trim());
    if (!m) { return null; }
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3] ? m[0] : null;
}

const round2 = v => Math.round((v + Number.EPSILON) * 100) / 100;
const clip = (v, max = 255) => String(v == null ? '' : v).trim().slice(0, max);
const oneOf = (group, v, fallback) => (OPT[group] && Object.prototype.hasOwnProperty.call(OPT[group], v)) ? v : fallback;

const fmt = {
    num(v, d = 0) {
        if (v == null || !isFinite(v)) { return '—'; }
        const fixed = Math.abs(v).toFixed(d);
        const [i, f] = fixed.split('.');
        const neg = v < 0 && Number(fixed) !== 0;
        return (neg ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (f ? ',' + f : '');
    },
    money(v) { return v == null || !isFinite(v) ? '—' : fmt.num(v, 0) + ' ₫'; },
    pct(r, d = 1) { return r == null || !isFinite(r) ? '—' : fmt.num(r * 100, d) + '%'; },
    times(v) { return v == null || !isFinite(v) ? '—' : fmt.num(v, 2) + 'x'; },
    short(v) {
        const a = Math.abs(v);
        if (a >= 1e9) { return fmt.num(v / 1e9, a >= 1e10 ? 0 : 1) + ' tỷ'; }
        if (a >= 1e6) { return fmt.num(v / 1e6, a >= 1e7 ? 0 : 1) + ' tr'; }
        if (a >= 1e3) { return fmt.num(v / 1e3, 0) + ' N'; }
        return fmt.num(v, 0);
    },
    date(s) { if (!s) { return '—'; } const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; },
    input(v) {
        if (v == null || v === '') { return ''; }
        const n = Number(v);
        return fmt.num(n, n % 1 === 0 ? 0 : 2);
    },
};

/* ---------------------------------------------------------------- calculations (mirror of the plugin's PHP) */

const M = {
    div(a, b) { return Math.abs(b) < 1e-9 ? null : a / b; },

    metrics(c) {
        const n = k => Number(c[k]) || 0;
        const spend = n('spend'), revenue = n('revenue');
        const cpm = M.div(spend, n('impressions'));
        return {
            ctr: M.div(n('clicks'), n('impressions')),
            cpc: M.div(spend, n('clicks')),
            cpm: cpm == null ? null : cpm * 1000,
            cpl: M.div(spend, n('leads')),
            cpa: M.div(spend, n('conversions')),
            lead_rate: M.div(n('leads'), n('clicks')),
            conv_rate: M.div(n('conversions'), n('leads')),
            roas: M.div(revenue, spend),
            roi: M.div(revenue - spend, spend),
            budget_usage: M.div(spend, n('budget')),
            remaining: n('budget') - spend,
            gross: revenue - spend,
        };
    },

    /** Ratios of a group are recomputed from summed counters, never averaged. */
    totals(list) {
        const keys = ['budget', 'spend', 'impressions', 'clicks', 'leads', 'conversions', 'revenue', 'booked'];
        const sum = Object.fromEntries(keys.map(k => [k, 0]));
        list.forEach(c => keys.forEach(k => { sum[k] += Number(c[k]) || 0; }));
        sum.count = list.length;
        return Object.assign(sum, M.metrics(sum));
    },

    byChannel(list) {
        const groups = {};
        list.forEach(c => { (groups[c.channel || 'other'] ||= []).push(c); });
        return Object.entries(groups).map(([channel, items]) => Object.assign({ channel }, M.totals(items)))
            .sort((a, b) => b.spend - a.spend);
    },

    splitVat(amount, ratePct, inclusive) {
        const r = Math.max(0, ratePct) / 100;
        let net, vat, total;
        if (inclusive) { total = round2(amount); net = round2(total / (1 + r)); vat = round2(total - net); }
        else { net = round2(amount); vat = round2(net * r); total = round2(net + vat); }
        return { net, vat, total };
    },

    journalLines(txns, acc) {
        const lines = [];
        txns.forEach(t => {
            const money = t.method === 'cash' ? acc.cash : acc.bank;
            const income = t.type === 'income';
            const catAcc = (t.account_code || '').trim() || (income ? acc.income_default : acc.expense_default);
            const base = { txn_id: t.id, date: t.txn_date, doc_no: t.doc_no || '', description: (t.description || '').trim() || t.category_name || '' };
            const net = Number(t.amount) || 0, vat = Number(t.vat_amount) || 0, total = Number(t.total) || net + vat;
            if (income) {
                lines.push({ ...base, account: money, debit: total, credit: 0 });
                lines.push({ ...base, account: catAcc, debit: 0, credit: net });
                if (vat > 0) { lines.push({ ...base, account: acc.vat_out, debit: 0, credit: vat }); }
            } else {
                lines.push({ ...base, account: catAcc, debit: net, credit: 0 });
                if (vat > 0) { lines.push({ ...base, account: acc.vat_in, debit: vat, credit: 0 }); }
                lines.push({ ...base, account: money, debit: 0, credit: total });
            }
        });
        return lines;
    },

    trialBalance(lines) {
        const accounts = {};
        let debit = 0, credit = 0;
        lines.forEach(l => {
            const a = accounts[l.account] ||= { debit: 0, credit: 0 };
            a.debit += l.debit; a.credit += l.credit; debit += l.debit; credit += l.credit;
        });
        const sorted = Object.keys(accounts).sort((a, b) => (a < b ? -1 : a > b ? 1 : 0))
            .map(code => ({ code, debit: round2(accounts[code].debit), credit: round2(accounts[code].credit) }));
        return { accounts: sorted, debit: round2(debit), credit: round2(credit) };
    },

    summarize(txns) {
        const s = { income: 0, expense: 0, vat_out: 0, vat_in: 0, cash_in: 0, cash_out: 0, count: txns.length };
        txns.forEach(t => {
            if (t.type === 'income') { s.income += +t.amount; s.vat_out += +t.vat_amount; s.cash_in += +t.total; }
            else { s.expense += +t.amount; s.vat_in += +t.vat_amount; s.cash_out += +t.total; }
        });
        s.profit = s.income - s.expense;
        s.margin = M.div(s.profit, s.income);
        s.vat_payable = Math.max(0, s.vat_out - s.vat_in);
        s.vat_carry = Math.max(0, s.vat_in - s.vat_out);
        s.net_cash = s.cash_in - s.cash_out;
        ['income', 'expense', 'vat_out', 'vat_in', 'cash_in', 'cash_out', 'profit', 'vat_payable', 'vat_carry', 'net_cash'].forEach(k => { s[k] = round2(s[k]); });
        return s;
    },

    monthly(txns, year) {
        const buckets = Array.from({ length: 12 }, () => []);
        txns.forEach(t => {
            if (Number(t.txn_date.slice(0, 4)) === year) { buckets[Number(t.txn_date.slice(5, 7)) - 1].push(t); }
        });
        return buckets.map(M.summarize);
    },

    quarterly(monthly) {
        return [0, 1, 2, 3].map(q => {
            const sum = { income: 0, expense: 0, profit: 0, vat_out: 0, vat_in: 0 };
            monthly.slice(q * 3, q * 3 + 3).forEach(m => Object.keys(sum).forEach(k => { sum[k] += m[k]; }));
            sum.vat_payable = Math.max(0, sum.vat_out - sum.vat_in);
            sum.vat_carry = Math.max(0, sum.vat_in - sum.vat_out);
            return sum;
        });
    },

    byCategory(txns) {
        const out = { income: {}, expense: {} };
        txns.forEach(t => {
            const type = t.type === 'income' ? 'income' : 'expense';
            const g = out[type][t.category_name || '—'] ||= { name: t.category_name || '—', net: 0, vat: 0, total: 0, count: 0, account_code: t.account_code || '', is_marketing: !!t.is_marketing };
            g.net += +t.amount; g.vat += +t.vat_amount; g.total += +t.total; g.count++;
        });
        return { income: Object.values(out.income).sort((a, b) => b.net - a.net), expense: Object.values(out.expense).sort((a, b) => b.net - a.net) };
    },

    movement(txns) {
        const m = { cash: 0, bank: 0 };
        txns.forEach(t => { m[t.method === 'cash' ? 'cash' : 'bank'] += (t.type === 'income' ? 1 : -1) * Number(t.total); });
        return { cash: round2(m.cash), bank: round2(m.bank) };
    },

    plan(target, aov, closeRate, cpl) {
        let orders = M.div(target, aov); orders = orders == null ? null : Math.ceil(orders - 1e-9);
        let leads = orders == null ? null : M.div(orders, closeRate); leads = leads == null ? null : Math.ceil(leads - 1e-9);
        const budget = leads == null ? null : leads * cpl;
        return { orders, leads, budget, roas: budget == null ? null : M.div(target, budget), cpa: budget == null || orders == null ? null : M.div(budget, orders) };
    },
};

/* ---------------------------------------------------------------- storage */

const COLLECTIONS = ['categories', 'campaigns', 'content', 'leads', 'transactions'];

function storageAvailable() {
    try { localStorage.setItem('__so_test', '1'); localStorage.removeItem('__so_test'); return true; } catch (e) { return false; }
}
const storageOk = storageAvailable();

function emptyDb() {
    return { version: 1, nextId: 1, meta: { last_backup: null }, settings: { opening_cash: 0, opening_bank: 0, accounts: { ...ACCOUNT_DEFAULTS } },
        categories: [], campaigns: [], content: [], leads: [], transactions: [] };
}

function seedCategories(d) {
    DEFAULT_CATEGORIES.forEach(([name, type, account_code, is_marketing], i) => {
        d.categories.push({ id: d.nextId++, name, type, account_code, is_marketing, sort_order: i * 10 });
    });
}

/** Validates a parsed backup or stored object. Returns a clean database or null. */
function normalize(raw) {
    if (!raw || typeof raw !== 'object' || !COLLECTIONS.every(k => raw[k] === undefined || Array.isArray(raw[k]))) { return null; }
    if (!COLLECTIONS.some(k => Array.isArray(raw[k]))) { return null; }
    const d = emptyDb();
    let maxId = 0;
    COLLECTIONS.forEach(k => {
        d[k] = (raw[k] || []).filter(x => x && typeof x === 'object' && Number.isFinite(Number(x.id)))
            .map(x => ({ ...x, id: Number(x.id) }));
        d[k].forEach(x => { maxId = Math.max(maxId, x.id); });
    });
    const s = raw.settings || {};
    d.settings.opening_cash = Number(s.opening_cash) || 0;
    d.settings.opening_bank = Number(s.opening_bank) || 0;
    d.settings.accounts = { ...ACCOUNT_DEFAULTS };
    Object.keys(ACCOUNT_DEFAULTS).forEach(k => {
        if (s.accounts && typeof s.accounts[k] === 'string' && validAccount(s.accounts[k]) && s.accounts[k] !== '') { d.settings.accounts[k] = s.accounts[k]; }
    });
    d.nextId = Math.max(Number(raw.nextId) || 1, maxId + 1);
    const lb = raw.meta && raw.meta.last_backup;
    d.meta.last_backup = typeof lb === 'string' && !isNaN(Date.parse(lb)) ? lb : null;
    return d;
}

function load() {
    let d = null;
    if (storageOk) {
        try { const raw = localStorage.getItem(STORE_KEY); if (raw) { d = normalize(JSON.parse(raw)); } } catch (e) { d = null; }
    }
    if (!d) { d = emptyDb(); seedCategories(d); }
    return d;
}

let db = load();

function persist() {
    if (!storageOk) { return false; }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; }
    catch (e) { toast('Không lưu được: bộ nhớ trình duyệt đã đầy hoặc bị chặn. Hãy sao lưu ra file ngay.'); return false; }
}

const nowStamp = () => new Date().toISOString();

function upsert(list, rec) {
    if (rec.id) {
        const i = list.findIndex(x => x.id === rec.id);
        if (i < 0) { return false; }
        list[i] = { ...list[i], ...rec, updated_at: nowStamp() };
    } else {
        rec.id = db.nextId++;
        rec.created_at = rec.updated_at = nowStamp();
        list.push(rec);
    }
    return true;
}

const byId = (list, id) => list.find(x => x.id === Number(id)) || null;
const validAccount = code => code === '' || /^[0-9A-Za-z.\-]{1,20}$/.test(code);

/* ---------------------------------------------------------------- saving with validation */

function result(errors, rec, list) {
    if (errors.length) { return { ok: false, errors }; }
    if (!upsert(list, rec)) { return { ok: false, errors: ['Không tìm thấy mục này, có thể đã bị xóa.'] }; }
    persist();
    return { ok: true, errors: [], rec };
}

function saveCampaign(f, id) {
    const n = k => Math.max(0, parseNum(f[k]));
    const rec = {
        id: id || 0, name: clip(f.name), channel: oneOf('channel', f.channel, 'other'), objective: oneOf('objective', f.objective, 'sales'),
        status: oneOf('campaign_status', f.status, 'planned'), start_date: parseDate(f.start_date), end_date: parseDate(f.end_date),
        budget: n('budget'), spend: n('spend'), impressions: Math.round(n('impressions')), clicks: Math.round(n('clicks')),
        leads: Math.round(n('leads')), conversions: Math.round(n('conversions')), revenue: n('revenue'),
        owner: clip(f.owner, 100), notes: clip(f.notes, 5000),
    };
    const e = [];
    if (!rec.name) { e.push('Nhập tên chiến dịch.'); }
    if (rec.start_date && rec.end_date && rec.end_date < rec.start_date) { e.push('Ngày kết thúc phải sau ngày bắt đầu.'); }
    if (rec.impressions > 0 && rec.clicks > rec.impressions) { e.push('Lượt click không thể lớn hơn lượt hiển thị.'); }
    if (!rec.id) { delete rec.id; }
    return result(e, rec, db.campaigns);
}

function saveContent(f, id) {
    let url = clip(f.url, 500);
    if (url && !/^https?:\/\//i.test(url)) { url = 'https://' + url; }
    let urlOk = true;
    if (url) { try { const u = new URL(url); urlOk = /^https?:$/.test(u.protocol) && u.hostname.includes('.'); } catch (err) { urlOk = false; } }
    const rec = {
        id: id || 0, title: clip(f.title), channel: oneOf('channel', f.channel, 'facebook'), format: oneOf('format', f.format, 'post'),
        publish_date: parseDate(f.publish_date), status: oneOf('content_status', f.status, 'idea'),
        campaign_id: byId(db.campaigns, f.campaign_id) ? Number(f.campaign_id) : null,
        assignee: clip(f.assignee, 100), url: url && urlOk ? url : '', notes: clip(f.notes, 5000),
    };
    const e = [];
    if (!rec.title) { e.push('Nhập tiêu đề.'); }
    if (url && !urlOk) { e.push('Link không hợp lệ.'); }
    if (!rec.id) { delete rec.id; }
    return result(e, rec, db.content);
}

function saveLead(f, id) {
    const email = clip(f.email);
    const rec = {
        id: id || 0, name: clip(f.name), company: clip(f.company), phone: clip(f.phone, 50), email,
        campaign_id: byId(db.campaigns, f.campaign_id) ? Number(f.campaign_id) : null,
        source: oneOf('channel', f.source, 'other'), stage: oneOf('stage', f.stage, 'new'),
        value: Math.max(0, parseNum(f.value)), assignee: clip(f.assignee, 100), notes: clip(f.notes, 5000),
    };
    const e = [];
    if (!rec.name) { e.push('Nhập tên khách.'); }
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { e.push('Email không hợp lệ.'); }
    if (!rec.id) { delete rec.id; }
    return result(e, rec, db.leads);
}

function saveTxn(f, id) {
    const type = oneOf('type', f.type, 'expense');
    const cat = byId(db.categories, f.category_id);
    const amount = parseNum(f.amount);
    const rate = Number(f.vat_rate);
    const date = parseDate(f.txn_date);
    const e = [];
    if (!date) { e.push('Nhập ngày hợp lệ.'); }
    if (!cat || cat.type !== type) { e.push('Chọn hạng mục đúng loại thu hoặc chi.'); }
    if (!(amount > 0)) { e.push('Số tiền phải lớn hơn 0.'); }
    if (!VAT_RATES.includes(rate)) { e.push('Thuế suất VAT chỉ được là 0%, 5%, 8% hoặc 10%.'); }
    const split = M.splitVat(Math.max(0, amount), VAT_RATES.includes(rate) ? rate : 0, !!f.vat_inclusive);
    const campaignId = type === 'expense' && byId(db.campaigns, f.campaign_id) ? Number(f.campaign_id) : null;
    const rec = {
        id: id || 0, txn_date: date, type, category_id: cat ? cat.id : null,
        amount: split.net, vat_rate: rate, vat_amount: split.vat, total: split.total,
        method: oneOf('method', f.method, 'bank'), counterparty: clip(f.counterparty), doc_no: clip(f.doc_no, 100),
        campaign_id: campaignId, description: clip(f.description, 2000),
    };
    if (!rec.id) { delete rec.id; }
    return result(e, rec, db.transactions);
}

function saveCategory(f, id) {
    const rec = {
        id: id || 0, name: clip(f.name), type: oneOf('type', f.type, 'expense'), account_code: clip(f.account_code, 20),
        is_marketing: !!f.is_marketing, sort_order: Math.round(parseNum(f.sort_order)),
    };
    const e = [];
    if (!rec.name) { e.push('Nhập tên hạng mục.'); }
    if (!validAccount(rec.account_code)) { e.push('Số tài khoản chỉ gồm chữ, số, dấu chấm hoặc gạch ngang (tối đa 20 ký tự).'); }
    if (rec.id && db.transactions.some(t => t.category_id === rec.id) && byId(db.categories, rec.id).type !== rec.type) {
        e.push('Hạng mục đã có bút toán nên không đổi được loại thu / chi.');
    }
    if (!rec.id) { delete rec.id; }
    return result(e, rec, db.categories);
}

function saveSetup(f) {
    const e = [];
    const accounts = {};
    Object.keys(ACCOUNT_DEFAULTS).forEach(k => {
        const code = clip(f['account_' + k], 20);
        if (!code || !validAccount(code)) { e.push(ACCOUNT_LABELS[k] + ': số tài khoản không hợp lệ.'); }
        accounts[k] = code;
    });
    if (e.length) { return { ok: false, errors: e }; }
    db.settings = { opening_cash: parseNum(f.opening_cash), opening_bank: parseNum(f.opening_bank), accounts };
    persist();
    return { ok: true, errors: [] };
}

function removeRecord(kind, id) {
    id = Number(id);
    if (kind === 'category' && db.transactions.some(t => t.category_id === id)) {
        return 'Hạng mục đang có bút toán, không thể xóa. Đổi tên hoặc chuyển bút toán sang hạng mục khác trước.';
    }
    if (kind === 'campaign') {
        ['content', 'leads', 'transactions'].forEach(k => db[k].forEach(x => { if (x.campaign_id === id) { x.campaign_id = null; } }));
    }
    const list = db[KINDS[kind].list];
    const i = list.findIndex(x => x.id === id);
    if (i >= 0) { list.splice(i, 1); }
    persist();
    return null;
}

/* ---------------------------------------------------------------- queries */

function withCategory(txns) {
    const cats = new Map(db.categories.map(c => [c.id, c]));
    return txns.map(t => {
        const c = cats.get(t.category_id);
        return { ...t, category_name: c ? c.name : '—', account_code: c ? c.account_code : '', is_marketing: c ? !!c.is_marketing : false };
    }).sort((a, b) => (a.txn_date < b.txn_date ? -1 : a.txn_date > b.txn_date ? 1 : a.id - b.id));
}

function txnsBetween(from, to) { return withCategory(db.transactions.filter(t => t.txn_date >= from && t.txn_date <= to)); }

function activeInYear(c, y) {
    const start = y + '-01-01', end = y + '-12-31';
    if (!c.start_date) { return true; }
    if (c.start_date >= start && c.start_date <= end) { return true; }
    return c.start_date < start && (!c.end_date || c.end_date >= start);
}

function campaignRows(f = {}) {
    const booked = {}, crm = {};
    db.transactions.forEach(t => { if (t.type === 'expense' && t.campaign_id) { booked[t.campaign_id] = (booked[t.campaign_id] || 0) + Number(t.amount); } });
    db.leads.forEach(l => { if (l.campaign_id) { crm[l.campaign_id] = (crm[l.campaign_id] || 0) + 1; } });
    return db.campaigns
        .filter(c => (!f.year || activeInYear(c, f.year)) && (!f.status || c.status === f.status) && (!f.channel || c.channel === f.channel))
        .map(c => {
            const row = { ...c, booked: round2(booked[c.id] || 0), crm_leads: crm[c.id] || 0 };
            row.gap = round2((Number(c.spend) || 0) - row.booked);
            row.m = M.metrics(row);
            return row;
        })
        .sort((a, b) => (b.start_date || '9999').localeCompare(a.start_date || '9999') || b.id - a.id);
}

function campaignNames() {
    return Object.fromEntries([...db.campaigns].sort((a, b) => a.name.localeCompare(b.name, 'vi')).map(c => [c.id, c.name]));
}

function leadStats(list) {
    const s = { total: list.length, won: 0, lost: 0, open: 0, pipeline: 0, won_value: 0 };
    list.forEach(l => {
        if (l.stage === 'won') { s.won++; s.won_value += Number(l.value) || 0; }
        else if (l.stage === 'lost') { s.lost++; }
        else { s.open++; s.pipeline += Number(l.value) || 0; }
    });
    s.win_rate = M.div(s.won, s.won + s.lost);
    return s;
}

function balanceBefore(date) {
    const mv = M.movement(db.transactions.filter(t => t.txn_date < date));
    const cash = round2(db.settings.opening_cash + mv.cash), bank = round2(db.settings.opening_bank + mv.bank);
    return { cash, bank, total: round2(cash + bank) };
}

function cashBook(from, to, f = {}) {
    const all = txnsBetween(from, to);
    const filtered = !!(f.type || f.category || f.method || f.campaign);
    const rows = all.filter(t => (!f.type || t.type === f.type) && (!f.category || t.category_id === Number(f.category))
        && (!f.method || t.method === f.method) && (!f.campaign || t.campaign_id === Number(f.campaign)));
    const opening = balanceBefore(from);
    let running = opening.total;
    const out = rows.map(t => {
        if (filtered) { return { ...t, balance: null }; }
        running = round2(running + (t.type === 'income' ? 1 : -1) * Number(t.total));
        return { ...t, balance: running };
    });
    const mv = M.movement(all);
    const closing = { cash: round2(opening.cash + mv.cash), bank: round2(opening.bank + mv.bank) };
    closing.total = round2(closing.cash + closing.bank);
    return { rows: out, summary: M.summarize(rows), opening, closing, filtered };
}

function yearReport(year) {
    const from = year + '-01-01', to = year + '-12-31';
    const txns = txnsBetween(from, to);
    const monthly = M.monthly(txns, year);
    const summary = M.summarize(txns);
    const marketing = round2(txns.filter(t => t.type === 'expense' && t.is_marketing).reduce((s, t) => s + Number(t.amount), 0));
    const opening = balanceBefore(from);
    const mv = M.movement(txns);
    return {
        year, summary, monthly, quarterly: M.quarterly(monthly), categories: M.byCategory(txns), opening, movement: mv,
        closing: { cash: round2(opening.cash + mv.cash), bank: round2(opening.bank + mv.bank) },
        marketing: { spend: marketing, share_of_revenue: M.div(marketing, summary.income), share_of_costs: M.div(marketing, summary.expense) },
    };
}

function journal(from, to) {
    const lines = M.journalLines(txnsBetween(from, to), db.settings.accounts);
    return { lines, trial: M.trialBalance(lines) };
}

/* ---------------------------------------------------------------- CSV & files */

function csv(header, rows) {
    const cell = v => {
        if (typeof v === 'number') { return String(v); }
        let s = v == null ? '' : String(v);
        if (s && isNaN(Number(s)) && /^[=+\-@\t\r]/.test(s)) { s = "'" + s; }
        return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return '\uFEFF' + [header, ...rows].map(r => r.map(cell).join(',')).join('\r\n') + '\r\n';
}

function download(filename, text, type = 'text/csv;charset=utf-8') {
    const blob = new Blob([text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

const r0 = v => (v == null || !isFinite(v) ? '' : Math.round(v));
const r4 = v => (v == null || !isFinite(v) ? '' : Math.round(v * 10000) / 10000);

        download('chien-dich-' + year + '.csv', csv(['Tên', 'Kênh', 'Trạng thái', 'Bắt đầu', 'Kết thúc', 'Ngân sách', 'Đã chi', 'Đã ghi sổ',
            'Hiển thị', 'Click', 'Leads', 'Đơn hàng', 'Doanh thu', 'CTR', 'CPC', 'CPL', 'CPA', 'ROAS', 'ROI'], rows));
    },
    ledger(from, to) {

        download('so-thu-chi_' + from + '_' + to + '.csv', csv(['Ngày', 'Số chứng từ', 'Loại', 'Hạng mục', 'Số TK', 'Diễn giải', 'Đối tác',
            'Hình thức', 'Trước thuế', 'Thuế suất', 'VAT', 'Tổng tiền', 'Số dư', 'Chiến dịch'], rows));
    },
    journal(from, to) {

    },
};

function selectBox(opts, selected, attrs = '', empty = null) {

}

/* ---------------------------------------------------------------- charts (inline SVG, no library) */

function channelChart(channels) {
    const rows = channels.filter(c => c.spend > 0 || c.revenue > 0);
    if (!rows.length) { return ''; }
    const max = Math.max(...rows.map(c => Math.max(c.spend, c.revenue)), 1);
    const W = 460, L = 92, R = 56, rowH = 46, top = 6, barW = W - L - R;
    const body = rows.map((c, i) => {
        const y = top + i * rowH;
        const ws = c.spend / max * barW, wr = c.revenue / max * barW;
        return `<text x="0" y="${y + 19}" style="fill:var(--ink)">${h(label('channel', c.channel))}</text>`
            + `<rect x="${L}" y="${y + 4}" width="${Math.max(ws, 1)}" height="14" fill="#C8102E"><title>Chi phí ${fmt.money(c.spend)}</title></rect>`
            + `<text x="${L + ws + 6}" y="${y + 16}">${fmt.short(c.spend)}</text>`
            + `<rect x="${L}" y="${y + 20}" width="${Math.max(wr, 1)}" height="14" fill="#2346A0"><title>Doanh thu ${fmt.money(c.revenue)}</title></rect>`
            + `<text x="${L + wr + 6}" y="${y + 32}">${fmt.short(c.revenue)}</text>`;
    }).join('');
    return '<div class="legend"><span><i style="background:#C8102E"></i>Chi phí</span><span><i style="background:#2346A0"></i>Doanh thu</span></div>'
        + `<svg class="chart is-compact" viewBox="0 0 ${W} ${top + rows.length * rowH}" role="img" aria-label="Chi phí và doanh thu theo kênh">${body}</svg>`;
}

function monthChart(monthly) {
    const W = 720, H = 240, L = 54, B = 26, T = 10, plotH = H - B - T, slot = (W - L - 6) / 12;
    const values = monthly.flatMap(m => [m.income, m.expense, m.profit]);
    const max = Math.max(...values, 1), min = Math.min(...values, 0);
    const y = v => T + (max - v) / (max - min) * plotH;
    const ticks = [max, (max + min) / 2, min, 0].filter((v, i, a) => a.indexOf(v) === i);
    let out = ticks.map(v => `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? '#A9B1C0' : '#E3E7EE'}"/>`
        + `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt.short(v)}</text>`).join('');
    const bw = Math.min(16, slot / 3);
    monthly.forEach((m, i) => {
        const x = L + i * slot + slot / 2;
        const bar = (v, dx, color, name) => {
            const top = Math.min(y(v), y(0)), hgt = Math.abs(y(v) - y(0));
            return `<rect x="${x + dx}" y="${top}" width="${bw}" height="${Math.max(hgt, v ? 1 : 0)}" fill="${color}"><title>${name} T${i + 1}: ${fmt.money(v)}</title></rect>`;
        };
        out += bar(m.income, -bw - 1, '#2346A0', 'Doanh thu') + bar(m.expense, 1, '#C8102E', 'Chi phí')
            + `<text x="${x}" y="${H - 8}" text-anchor="middle">T${i + 1}</text>`;
    });
    const pts = monthly.map((m, i) => `${L + i * slot + slot / 2},${y(m.profit)}`).join(' ');
    out += `<polyline points="${pts}" fill="none" stroke="#1F2A44" stroke-width="2" stroke-linejoin="round"/>`
        + monthly.map((m, i) => `<circle cx="${L + i * slot + slot / 2}" cy="${y(m.profit)}" r="3" fill="#1F2A44"><title>Lợi nhuận T${i + 1}: ${fmt.money(m.profit)}</title></circle>`).join('');
    return '<div class="legend"><span><i style="background:#2346A0"></i>Doanh thu</span><span><i style="background:#C8102E"></i>Chi phí</span><span><i style="background:#1F2A44;height:3px;vertical-align:3px"></i>Lợi nhuận</span></div>'
        + `<div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:560px" role="img" aria-label="Doanh thu, chi phí và lợi nhuận theo tháng">${out}</svg></div>`;
}

const CALCS = {
    roas(i) {
        const margin = i.margin / 100, profit = i.revenue * margin - i.spend;
        return { roas: fmt.times(M.div(i.revenue, i.spend)), breakeven: fmt.times(M.div(1, margin)), profit: signed(profit),
            verdict: Math.abs(profit) < 1 ? 'Hòa vốn' : (profit > 0 ? '<span class="pos">Có lãi</span>' : '<span class="neg">Đang lỗ</span>') };
    },
    plan(i) {
        const p = M.plan(i.target, i.aov, i.close / 100, i.cpl);
        return { orders: fmt.num(p.orders), leads: fmt.num(p.leads), budget: fmt.money(p.budget), cpa: fmt.money(p.cpa), roas: fmt.times(p.roas) };
    },
    funnel(i) {
        const imp = i.cpm > 0 ? i.budget / i.cpm * 1000 : null;
        const clicks = imp == null ? null : imp * i.ctr / 100;
        const leads = clicks == null ? null : clicks * i.cvr / 100;
        return { impressions: fmt.num(imp), clicks: fmt.num(clicks), cpc: fmt.money(clicks ? i.budget / clicks : null), leads: fmt.num(leads), cpl: fmt.money(leads ? i.budget / leads : null) };
    },
    vat(i) {
        const s = M.splitVat(i.amount, i.rate, i.inclusive);
        return { net: fmt.money(s.net), vat: fmt.money(s.vat), total: fmt.money(s.total) };
    },
};

function runCalc(box) {
    const input = {};
    $$('[data-in]', box).forEach(el => { input[el.dataset.in] = el.type === 'checkbox' ? el.checked : parseNum(el.value); });
    const out = CALCS[box.dataset.calc](input);
    Object.entries(out).forEach(([k, v]) => { const el = $(`[data-out="${k}"]`, box); if (el) { el.innerHTML = v; } });
}

function quickPeriods(path, cur) {
    const y = thisYear(), m = new Date().getMonth() + 1, q = Math.ceil(m / 3);
    const lm = new Date(y, m - 2, 1);
    const periods = [
        ['Tháng này', today().slice(0, 8) + '01', monthEnd(y, m)],
        ['Tháng trước', ymd(lm), monthEnd(lm.getFullYear(), lm.getMonth() + 1)],
        ['Quý này', y + '-' + pad((q - 1) * 3 + 1) + '-01', monthEnd(y, q * 3)],
        ['Năm nay', y + '-01-01', y + '-12-31'],
        ['Năm trước', (y - 1) + '-01-01', (y - 1) + '-12-31'],
    ];
    return '<div class="chips">' + periods.map(([t, a, b]) => `<button type="button" class="chip" data-act="period" data-path="${path}" data-from="${a}" data-to="${b}" aria-pressed="${cur.from === a && cur.to === b}">${t}</button>`).join('') + '</div>';
}

        + '<th class="num">Thu</th><th class="num">Chi</th><th class="num">VAT</th>' + (book.filtered ? '' : '<th class="num">Số dư</th>')
        + '<th>Hình thức</th><th><span class="sr-only">Thao tác</span></th></tr></thead><tbody>';
    html += book.rows.map(t => `<tr><td>${fmt.date(t.txn_date)}</td><td>${h(t.doc_no)}</td>`
        + `<td>${h(t.description) || '<span class="muted">—</span>'}${t.counterparty ? `<span class="sub">${h(t.counterparty)}</span>` : ''}`
        + (t.campaign_id && names[t.campaign_id] ? `<span class="sub">Chiến dịch: ${h(names[t.campaign_id])}</span>` : '') + '</td>'
        + `<td>${h(t.category_name)}<span class="sub">${h(t.account_code)}</span></td>`
        + `<td class="num pos">${t.type === 'income' ? fmt.money(t.total) : ''}</td><td class="num neg">${t.type === 'expense' ? fmt.money(t.total) : ''}</td>`
        + `<td class="num muted">${Number(t.vat_amount) > 0 ? fmt.money(t.vat_amount) + `<span class="sub">${t.vat_rate}%</span>` : ''}</td>`
        + (book.filtered ? '' : `<td class="num">${signed(t.balance)}</td>`)
        + `<td>${h(label('method', t.method))}</td>` + rowActions('txn', t.id) + '</tr>').join('');
    html += `</tbody><tfoot><tr><td colspan="4">Cộng phát sinh (${s.count} khoản)</td><td class="num">${fmt.money(s.cash_in)}</td><td class="num">${fmt.money(s.cash_out)}</td>`
        + `<td class="num">${fmt.money(s.vat_out + s.vat_in)}</td>` + (book.filtered ? '' : `<td class="num">${signed(book.closing.total)}</td>`) + '<td colspan="2"></td></tr></tfoot></table></div>';
    return html;
};

VIEWS.journal = () => {
    const f = ui.journal;
    const j = journal(f.from, f.to);
    const tb = j.trial;
    const balanced = Math.abs(tb.debit - tb.credit) < 0.01;
    let html = pageHead('Nhật ký chung', 'Bút toán Nợ / Có tự sinh từ Sổ thu chi theo số tài khoản của từng hạng mục. Thu: Nợ 111/112, Có doanh thu, Có VAT đầu ra. Chi: Nợ chi phí, Nợ VAT đầu vào, Có 111/112.',
        exportBtn('journal'));
    html += `<div class="toolbar"><div><label for="j-from">Từ ngày</label><input type="date" id="j-from" data-filter="journal.from" value="${f.from}"></div>`
        + `<div><label for="j-to">Đến ngày</label><input type="date" id="j-to" data-filter="journal.to" value="${f.to}"></div></div>` + quickPeriods('journal', f);
    if (!j.lines.length) { return html + '<p class="muted">Kỳ này chưa có bút toán. <a href="#ledger">Mở Sổ thu chi</a></p>'; }

    html += '<div class="stamp-wrap">'
        + tally([['Tổng phát sinh Nợ', fmt.money(tb.debit)], ['Tổng phát sinh Có', fmt.money(tb.credit), { total: true }]])
        + (balanced ? '<div class="stamp land" role="img" aria-label="Đã cân: tổng Nợ bằng tổng Có"><b>ĐÃ CÂN</b><small>Nợ = Có</small></div>'
            : '<div class="stamp" role="img" aria-label="Lệch: tổng Nợ khác tổng Có"><b>LỆCH</b><small>Nợ ≠ Có</small></div>')
        + '</div>';
    html += '<h2>Bảng cân đối số phát sinh</h2><div class="scroll"><table class="book"><thead><tr><th>Tài khoản</th><th class="num">Phát sinh Nợ</th><th class="num">Phát sinh Có</th><th class="num">Chênh lệch</th></tr></thead><tbody>'
        + tb.accounts.map(a => {
            const net = round2(a.debit - a.credit);
            return `<tr><td><b>${h(a.code)}</b></td><td class="num">${a.debit ? fmt.money(a.debit) : ''}</td><td class="num">${a.credit ? fmt.money(a.credit) : ''}</td>`
                + `<td class="num">${Math.abs(net) >= 0.01 ? fmt.money(Math.abs(net)) + ` <span class="muted small">${net > 0 ? 'Nợ' : 'Có'}</span>` : ''}</td></tr>`;
        }).join('')
        + `</tbody><tfoot><tr><td>Tổng cộng</td><td class="num">${fmt.money(tb.debit)}</td><td class="num">${fmt.money(tb.credit)}</td><td></td></tr></tfoot></table></div>`
        + '<p class="hint">Chỉ gồm phát sinh trong kỳ, chưa gồm số dư đầu kỳ của các tài khoản.</p>';
    let prev = null;
    html += `<h2>Bút toán (${j.lines.length} dòng)</h2><div class="scroll"><table class="book ruled"><thead><tr><th>Ngày</th><th>Số CT</th><th>Diễn giải</th><th>Tài khoản</th><th class="num">Nợ</th><th class="num">Có</th></tr></thead><tbody>`
        + j.lines.map((l, i) => {
            const first = l.txn_id !== prev; prev = l.txn_id;
            return `<tr class="${first && i ? 'group-start' : ''}"><td>${first ? fmt.date(l.date) : ''}</td><td>${first ? h(l.doc_no) : ''}</td><td>${first ? h(l.description) : ''}</td>`
                + `<td class="${l.credit ? 'indent' : ''}">${h(l.account)}</td><td class="num">${l.debit ? fmt.money(l.debit) : ''}</td><td class="num">${l.credit ? fmt.money(l.credit) : ''}</td></tr>`;
        }).join('') + '</tbody></table></div>';
    return html;
};

        + (hasSample ? '<button type="button" class="btn" data-act="clear-sample">Xóa dữ liệu mẫu</button>' : '<button type="button" class="btn" data-act="sample">Tạo dữ liệu mẫu</button>')
        + '<button type="button" class="btn btn-link is-danger" data-act="wipe">Xóa toàn bộ dữ liệu</button></div>';

    html += '<h2>Số dư ban đầu và tài khoản mặc định</h2>'
        + '<form id="setup-form" novalidate><div class="grid">'
        + `<div><label for="s-cash">Tồn quỹ tiền mặt ban đầu</label><input type="text" inputmode="decimal" id="s-cash" name="opening_cash" value="${fmt.input(st.opening_cash)}" placeholder="0"></div>`
        + `<div><label for="s-bank">Số dư ngân hàng ban đầu</label><input type="text" inputmode="decimal" id="s-bank" name="opening_bank" value="${fmt.input(st.opening_bank)}" placeholder="0"></div>`

        + '</div><div class="errors" id="setup-errors" role="alert"></div>'

        + '<div class="page-actions" style="margin-top:12px"><button type="submit" class="btn btn-primary">Lưu thiết lập</button></div></form>';

    html += '<div class="page-head" style="margin:36px 0 12px"><h2 style="margin:0">Hạng mục thu chi</h2>' + addBtn('category', 'Thêm hạng mục') + '</div>'
        + '<div class="scroll"><table class="book"><thead><tr><th>Tên</th><th>Loại</th><th>Số TK</th><th>Chi phí marketing</th><th><span class="sr-only">Thao tác</span></th></tr></thead><tbody>'
        + [...db.categories].sort((a, b) => b.type.localeCompare(a.type) || a.sort_order - b.sort_order).map(c => `<tr><td>${h(c.name)}${used.has(c.id) ? '<span class="sub">Đang có bút toán</span>' : ''}</td>`
            + `<td>${h(label('type', c.type))}</td><td>${h(c.account_code) || `<span class="muted">mặc định ${h(c.type === 'income' ? st.accounts.income_default : st.accounts.expense_default)}</span>`}</td>`

    return html;
};

};

function field(f) {
    const id = 'fld-' + f.name;
    const cls = f.wide ? ' class="wide"' : '';
    const v = f.value == null ? '' : f.value;
    switch (f.type) {
        case 'select':
            return `<div${cls}><label for="${id}">${h(f.label)}</label>${selectBox(f.options, v, `id="${id}" name="${f.name}"`, f.empty == null ? null : f.empty)}</div>`;
        case 'catselect': {
            const groups = ['income', 'expense'].map(t => `<optgroup label="${h(label('type', t))}" data-type="${t}">`
                + Object.entries(categoryOptions(t)).map(([cid, name]) => `<option value="${cid}"${String(v) === cid ? ' selected' : ''}>${h(name)}</option>`).join('') + '</optgroup>').join('');
            return `<div${cls}><label for="${id}">${h(f.label)}</label><select id="${id}" name="${f.name}"><option value="">Chọn hạng mục</option>${groups}</select></div>`;
        }
        case 'textarea':
            return `<div${cls}><label for="${id}">${h(f.label)}</label><textarea id="${id}" name="${f.name}" rows="2">${h(v)}</textarea></div>`;
        case 'check':
            return `<label class="check${f.wide ? ' wide' : ''}" style="padding-top:22px"><input type="checkbox" id="${id}" name="${f.name}"${v ? ' checked' : ''}> ${h(f.label)}</label>`;
        case 'radio':
            return `<div${cls}><span class="label" id="${id}-label">${h(f.label)}</span><div class="radio-row" role="radiogroup" aria-labelledby="${id}-label">`
                + Object.entries(f.options).map(([k, t]) => `<label class="check"><input type="radio" name="${f.name}" value="${k}"${String(v) === k ? ' checked' : ''}> ${h(t)}</label>`).join('')
                + '</div></div>';
        case 'money':
        case 'int':
            return `<div${cls}><label for="${id}">${h(f.label)}</label><input type="text" inputmode="${f.type === 'int' ? 'numeric' : 'decimal'}" id="${id}" name="${f.name}" value="${h(fmt.input(v))}" placeholder="0" autocomplete="off"></div>`;
        default:
            return `<div${cls}><label for="${id}">${h(f.label)}</label><input type="${f.type}" id="${id}" name="${f.name}" value="${h(v)}"${f.placeholder ? ` placeholder="${h(f.placeholder)}"` : ''}></div>`;
    }
}

let current = null;
const dlg = $('#dlg');

function openForm(kind, id, preset = {}) {
    const K = KINDS[kind];
    const rec = id ? byId(db[K.list], id) : null;
    if (id && !rec) { toast('Không tìm thấy mục này, có thể đã bị xóa.'); return; }
    current = { kind, id: rec ? rec.id : null };
    $('#dlg-title').textContent = (rec ? 'Sửa ' : 'Thêm ') + K.noun;
    $('#dlg-errors').innerHTML = '';
    $('#dlg-fields').innerHTML = '<div class="grid">' + K.fields(rec ? { ...rec } : { ...K.defaults(), ...preset }).map(field).join('') + '</div>'
        + (K.preview ? '<p class="preview" id="dlg-preview" aria-live="polite"></p>' : '')
        + (K.hint ? `<p class="hint">${h(K.hint)}</p>` : '');
    $('#dlg-foot').innerHTML = `<button type="submit" class="btn btn-primary">Lưu ${h(K.noun)}</button><button type="button" class="btn" data-act="close-dialog">Hủy</button><span class="spacer"></span>`
        + (rec ? `<button type="button" class="btn btn-link is-danger" data-act="delete" data-kind="${kind}" data-id="${rec.id}">Xóa ${h(K.noun)}</button>` : '');
    if (typeof dlg.showModal === 'function') { if (!dlg.open) { dlg.showModal(); } } else { dlg.setAttribute('open', ''); }
    if (kind === 'txn') { syncTxnForm(); }
    const first = $('#dlg-fields input:not([type=radio]):not([type=checkbox]), #dlg-fields select');
    if (first) { first.focus(); }
}

function closeDialog() {
    if (typeof dlg.close === 'function' && dlg.open) { dlg.close(); } else { dlg.removeAttribute('open'); }
    current = null;
}

function formValues(form) {
    const data = {};
    Array.from(form.elements).forEach(el => {
        if (!el.name) { return; }
        if (el.type === 'checkbox') { data[el.name] = el.checked; }
        else if (el.type === 'radio') { if (el.checked) { data[el.name] = el.value; } }
        else { data[el.name] = el.value; }
    });
    return data;
}

/** Only categories of the chosen type are selectable; campaigns apply to expenses only; live VAT preview. */
function syncTxnForm() {
    const form = $('#dlg-form');
    const type = (form.querySelector('input[name="type"]:checked') || {}).value || 'expense';
    const cat = $('#fld-category_id');
    $$('optgroup', cat).forEach(g => {
        const on = g.dataset.type === type;
        g.hidden = !on;
        $$('option', g).forEach(o => { o.disabled = !on; });
    });
    if (cat.selectedOptions.length && cat.selectedOptions[0].disabled) { cat.value = ''; }
    $('#fld-campaign_id').closest('div').style.display = type === 'expense' ? '' : 'none';
    const amount = parseNum($('#fld-amount').value);
    const s = M.splitVat(amount, Number($('#fld-vat_rate').value), $('#fld-vat_inclusive').checked);
    $('#dlg-preview').textContent = amount > 0 ? `Trước thuế ${fmt.money(s.net)}   |   VAT ${fmt.money(s.vat)}   |   Tổng ${fmt.money(s.total)}` : '';
}

$('#dlg-form').addEventListener('submit', e => {
    e.preventDefault();
    if (!current) { return; }
    const K = KINDS[current.kind];
    const res = K.save(formValues(e.target), current.id);
    if (!res.ok) {
        $('#dlg-errors').innerHTML = res.errors.map(h).join('<br>');
        const box = $('#dlg-errors');
        if (box.scrollIntoView) { box.scrollIntoView({ block: 'nearest' }); }
        return;
    }
    const rec = res.rec, wasEdit = !!current.id;
    // Keep the saved record in view.
    if (current.kind === 'content' && rec.publish_date) { ui.month = rec.publish_date.slice(0, 7); }
    if (current.kind === 'txn' && (rec.txn_date < ui.ledger.from || rec.txn_date > ui.ledger.to)) {
        const [y, m] = rec.txn_date.split('-').map(Number);
        ui.ledger.from = rec.txn_date.slice(0, 8) + '01'; ui.ledger.to = monthEnd(y, m);
    }
    if (current.kind === 'campaign' && !activeInYear(rec, ui.camp.year) && rec.start_date) { ui.camp.year = Number(rec.start_date.slice(0, 4)); }
    closeDialog();
    toast((wasEdit ? 'Đã lưu ' : 'Đã thêm ') + K.noun + '.');
    render();
});

dlg.addEventListener('input', () => { if (current && current.kind === 'txn') { syncTxnForm(); } });
dlg.addEventListener('change', () => { if (current && current.kind === 'txn') { syncTxnForm(); } });
dlg.addEventListener('close', () => { current = null; });

/* ---------------------------------------------------------------- sample data */

        ['Anh Tuấn', 'Nhà hàng Bếp Quê', 'contacted', 8e6, 'fb'], ['Chị Ngọc', '', 'qualified', 6.5e6, 'tt'], ['Anh Dũng', 'Cty TNHH Dũng Phát', 'qualified', 25e6, 'gg'],

            const s = M.splitVat(amount, rate, incl);

function clearSample() {
    const removed = new Set(db.campaigns.filter(c => c.sample).map(c => c.id));
    COLLECTIONS.forEach(k => { db[k] = db[k].filter(x => !x.sample); });
    ['content', 'leads', 'transactions'].forEach(k => db[k].forEach(x => { if (removed.has(x.campaign_id)) { x.campaign_id = null; } }));
    if (db.meta.sample_opening && db.settings.opening_cash === 20e6 && db.settings.opening_bank === 150e6) {
        db.settings.opening_cash = 0; db.settings.opening_bank = 0;
    }
    delete db.meta.sample_opening;
    persist();
}

/* ---------------------------------------------------------------- events */

let toastTimer = null;
function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}

function setPath(path, value) {
    const keys = path.split('.');
    let o = ui;
    keys.slice(0, -1).forEach(k => { o = o[k]; });
    o[keys[keys.length - 1]] = value;
}

const ACTIONS = {
    add: el => openForm(el.dataset.kind, null, el.dataset.type ? { type: el.dataset.type } : el.dataset.date ? { publish_date: el.dataset.date } : {}),
    edit: el => openForm(el.dataset.kind, Number(el.dataset.id)),
    delete: el => {
        const K = KINDS[el.dataset.kind];
        if (!confirm('Xóa ' + K.noun + ' này? Không thể hoàn tác.')) { return; }
        const err = removeRecord(el.dataset.kind, el.dataset.id);
        if (err) { toast(err); return; }
        if (dlg.open) { closeDialog(); }
        toast('Đã xóa ' + K.noun + '.');
        render();
    },
    'close-dialog': () => closeDialog(),
    export: el => {
        const w = el.dataset.what;
        if (w === 'campaigns') { EXPORTS.campaigns(ui.camp.year); }
        if (w === 'ledger') { EXPORTS.ledger(ui.ledger.from, ui.ledger.to); }
        if (w === 'ledger-year') { EXPORTS.ledger(ui.reportYear + '-01-01', ui.reportYear + '-12-31'); }
        if (w === 'journal') { EXPORTS.journal(ui.journal.from, ui.journal.to); }
    },
    month: el => { ui.month = el.dataset.to; render(); },
    period: el => { ui[el.dataset.path].from = el.dataset.from; ui[el.dataset.path].to = el.dataset.to; render(); },
    'open-month': el => {
        const [y, m] = el.dataset.month.split('-').map(Number);
        Object.assign(ui.ledger, { from: el.dataset.month + '-01', to: monthEnd(y, m), type: '', category: '', method: '', campaign: '' });
        location.hash = '#ledger';
    },
    sample: () => {
        if (!confirm('Thêm dữ liệu mẫu (5 chiến dịch, nội dung, leads và thu chi 3 tháng gần nhất)? Có thể xóa lại ở trang Thiết lập.')) { return; }
        addSample(); ui.dashYear = thisYear(); ui.camp.year = thisYear();
        toast('Đã thêm dữ liệu mẫu.'); render();
    },
    'clear-sample': () => {
        if (!confirm('Xóa toàn bộ dữ liệu mẫu? Dữ liệu bạn tự nhập vẫn được giữ.')) { return; }
        clearSample(); toast('Đã xóa dữ liệu mẫu.'); render();
    },
    backup: () => {
        db.meta.last_backup = nowStamp();
        persist();
        download('so-marketing-sao-luu-' + today() + '.json', JSON.stringify(db, null, 2), 'application/json');
        toast('Đã tải file sao lưu.'); render();
    },
    restore: () => $('#restore-file').click(),
    wipe: () => {
        if (!confirm('Xóa toàn bộ chiến dịch, nội dung, leads, thu chi và thiết lập? Nên tải file sao lưu trước.')) { return; }
        if (!confirm('Chắc chắn xóa? Thao tác này không hoàn tác được.')) { return; }
        db = emptyDb(); seedCategories(db); persist();
        toast('Đã xóa toàn bộ dữ liệu.'); render();
    },
};

document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && ACTIONS[el.dataset.act]) { e.preventDefault(); ACTIONS[el.dataset.act](el); }
});

let searchTimer = null;
function applyFilter(el) {
    const path = el.dataset.filter;
    let v = el.value;
    if (/year|Year/.test(path)) { v = Number(v) || thisYear(); }
    if (/\.(from|to)$/.test(path)) {
        if (!parseDate(v)) { return; }
        setPath(path, v);
        const p = ui[path.split('.')[0]];
        if (p.from > p.to) { [p.from, p.to] = [p.to, p.from]; }
    } else {
        setPath(path, v);
    }
    if (path === 'ledger.type' && ui.ledger.category && (byId(db.categories, ui.ledger.category) || {}).type !== v && v) { ui.ledger.category = ''; }
    render();
}

document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.filter && el.dataset.filter !== 'leads.q') { applyFilter(el); return; }
    if (el.dataset.set) {
        const [list, key] = el.dataset.set.split(':');
        const rec = byId(db[list], el.dataset.id);
        const group = key === 'stage' ? 'stage' : 'content_status';
        if (rec) { rec[key] = oneOf(group, el.value, rec[key]); rec.updated_at = nowStamp(); persist(); toast('Đã cập nhật: ' + label(group, rec[key]) + '.'); render(); }
    }
});

document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.filter === 'leads.q') { clearTimeout(searchTimer); searchTimer = setTimeout(() => applyFilter(el), 200); return; }
    const box = el.closest('.calc');
    if (box) { runCalc(box); }
});

document.addEventListener('submit', e => {
    if (e.target.id !== 'setup-form') { return; }
    e.preventDefault();
    const res = saveSetup(formValues(e.target));
    if (!res.ok) { $('#setup-errors').innerHTML = res.errors.map(h).join('<br>'); return; }
    toast('Đã lưu thiết lập.'); render();
});

$('#restore-file').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) { return; }
    const reader = new FileReader();
    reader.onload = () => {
        let d = null;
        try { d = normalize(JSON.parse(String(reader.result))); } catch (err) { d = null; }
        if (!d) { toast('File không đúng định dạng sao lưu của Sổ Marketing.'); return; }
        const msg = `File có ${d.campaigns.length} chiến dịch, ${d.content.length} nội dung, ${d.leads.length} lead, ${d.transactions.length} khoản thu chi. Thay toàn bộ dữ liệu hiện tại bằng file này?`;
        if (!confirm(msg)) { return; }
        db = d; persist();
        toast('Đã khôi phục dữ liệu từ file.'); render();
    };
    reader.readAsText(file);
});

/* ---------------------------------------------------------------- render */

function currentPage() {
    const id = location.hash.replace('#', '');
    return Object.prototype.hasOwnProperty.call(VIEWS, id) ? id : 'dashboard';
}

function renderNav(page) {
    const groups = {};
    PAGES.forEach(p => { (groups[p.group] ||= []).push(p); });
    $('#nav').innerHTML = Object.entries(groups).map(([g, list]) => `<div class="nav-group"><span class="nav-label">${h(g)}</span>`
        + list.map(p => `<a href="#${p.id}"${p.id === page ? ' aria-current="page"' : ''}>${h(p.label)}</a>`).join('') + '</div>').join('');
}

function render() {
    const page = currentPage();
    renderNav(page);
    const active = document.activeElement;
    const keepId = active && active.id && $('#app').contains(active) ? active.id : null;
    const caret = keepId && typeof active.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd] : null;
    $('#app').innerHTML = VIEWS[page]();
    $$('.calc').forEach(runCalc);
    document.title = PAGES.find(p => p.id === page).label + ' | Sổ Marketing';
    const backup = db.meta.last_backup ? 'Sao lưu gần nhất ' + new Date(db.meta.last_backup).toLocaleDateString('vi-VN') + '.' : 'Chưa có bản sao lưu nào.';
    $('#foot').innerHTML = `Dữ liệu được lưu trong trình duyệt trên thiết bị này. ${backup} <a href="#setup">Sao lưu dữ liệu</a>`;
    if (keepId) {
        const el = document.getElementById(keepId);
        if (el) { el.focus(); if (caret && el.setSelectionRange) { try { el.setSelectionRange(caret[0], caret[1]); } catch (err) { /* not a text input */ } } }
    }
}

window.addEventListener('hashchange', () => {
    if (dlg.open) { closeDialog(); }
    render();
    window.scrollTo(0, 0);
    $('#app').focus({ preventScroll: true });
});

render();
</script>
